services:
  omebis:
    image: ${OMEBIS_IMAGE}
    pull_policy: never
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://omebis:${OMEBIS_DB_PASSWORD}@omebis-db:5432/omebis?schema=public
      - AUTH_SECRET=${OMEBIS_AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - CRON_SECRET=${OMEBIS_CRON_SECRET}
      - OMEBIS_PUBLIC_URL=${OMEBIS_PUBLIC_URL}
      - PAPPERS_API_KEY=${OMEBIS_PAPPERS_API_KEY}
      - PAPPERS_API_KEYS=${OMEBIS_PAPPERS_API_KEYS}
      - OPENAI_API_KEY=${OMEBIS_OPENAI_API_KEY}
      - OPENAI_MODEL=${OMEBIS_OPENAI_MODEL}
      - OPENAI_REASONING_EFFORT=${OMEBIS_OPENAI_REASONING_EFFORT}
      - ABSTRACT_API_KEY=${OMEBIS_ABSTRACT_API_KEY}
      - SMTP_HOST=${OMEBIS_SMTP_HOST}
      - SMTP_PORT=${OMEBIS_SMTP_PORT}
      - SMTP_USER=${OMEBIS_SMTP_USER}
      - SMTP_PASS=${OMEBIS_SMTP_PASS}
      - SMTP_FROM=${OMEBIS_SMTP_FROM}
    depends_on:
      omebis-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.submission.schedule: "0 0 2 * * *"
      ofelia.job-exec.submission.command: 'sh -c "curl -fsS --max-time 290 -X POST -H \"Authorization: Bearer $$CRON_SECRET\" http://127.0.0.1:3000/api/cron/SUBMISSION_CHECK"'
      ofelia.job-exec.legal.schedule: "0 0 3 * * *"
      ofelia.job-exec.legal.command: 'sh -c "curl -fsS --max-time 290 -X POST -H \"Authorization: Bearer $$CRON_SECRET\" http://127.0.0.1:3000/api/cron/LEGAL_SYNC"'
      ofelia.job-exec.edistat.schedule: "0 30 3 * * *"
      ofelia.job-exec.edistat.command: 'sh -c "curl -fsS --max-time 290 -X POST -H \"Authorization: Bearer $$CRON_SECRET\" http://127.0.0.1:3000/api/cron/EDISTAT_SYNC"'
      ofelia.job-exec.diffusion.schedule: "0 0 4 * * 0"
      ofelia.job-exec.diffusion.command: 'sh -c "curl -fsS --max-time 290 -X POST -H \"Authorization: Bearer $$CRON_SECRET\" http://127.0.0.1:3000/api/cron/DIFFUSION_SYNC"'
    x-runtipi:
      is_main: true
      internal_port: 3000

  omebis-db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=omebis
      - POSTGRES_PASSWORD=${OMEBIS_DB_PASSWORD}
      - POSTGRES_DB=omebis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omebis -d omebis"]
      interval: 10s
      timeout: 5s
      retries: 10

  omebis-ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --docker
    environment:
      - TZ=Europe/Paris
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - omebis

x-runtipi:
  schema_version: 2
